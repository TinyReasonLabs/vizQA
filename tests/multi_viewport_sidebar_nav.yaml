name: "Nexus CRM: Multi-Viewport Sidebar Navigation"
url: "file://${PWD}/demo_site/index.html"
description: "A compact smoke test intended to be run with multiple viewport lanes so reporter output can be judged side by side."
steps:
  - action: "Click on 'Customers' in the sidebar"
    expect: "Main page header 'Customers' and the sidebar item becomes active"
  - action: "Click on 'Settings' in the sidebar"
    expect: "Main page header 'Settings'"
  - action: "Click on 'Overview' in the sidebar"
    expect: "Should return to the 'Dashboard Overview'"

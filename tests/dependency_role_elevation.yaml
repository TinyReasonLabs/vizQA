name: "Dependency Role Elevation"
url: "file:///Users/alieissa/Projects/Coding/vizQA/demo_site/dependency_auth_lab.html"
description: "Uses step-up authentication to elevate an analyst session into manager access."

requires:
  - dependency_login_mfa

artifacts:
  password: "AnalystPass!23"
  mfa_code: "246810"
  elevated_role: "Manager"

steps:
  - action: "Click the 'Elevate to Manager Role' button"
    expect: "A step-up authentication modal should appear"
  - action: "Type {password} into the current password field"
    expect: "The current password field should be filled"
  - action: "Type {mfa_code} into the current one-time code field"
    expect: "The current one-time code field should contain '246810'"
  - action: "Click the 'Approve elevation' button"
    expect: "role '{elevated_role}' and the 'Manager Approvals' view should load"

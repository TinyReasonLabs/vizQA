
[project]
name = "vizQA"
version = "0.3.0"
description = "Vision-driven UI Testing Framework"
authors = [
    {name = "Spospider", email = "64846609+Spospider@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "playwright (>=1.58.0,<2.0.0)",
    "click (>=8.1.7)",
    "pyyaml (>=6.0.1)",
    "rich (>=13.7.0)",
    "httpx (>=0.27.0)",
    "onnxruntime (>=1.24.3,<2.0.0)",
    "tokenizers (>=0.22.2,<0.23.0)",
    "pydantic (>=2.6.0)",
    "tomli (>=2.0.0,<3.0.0) ; python_version < '3.11'"
]

[project.scripts]
vizqa = "vizQA.app.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["vizQA", ".github/scripts"]
testpaths = ["vizQA/tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "vizQA", from = "." }
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-json-report (>=1.5.0)",
    "pylint (>=4.0.4)"
]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/test*/*"
]

name: Update Badges

on:
  push:
    branches: [main, release/*]

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install

      - name: Cache Model Weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: ./vizQA/weights
          # The key uses your release tag; if the tag changes, the cache misses and re-downloads
          key: ${{ runner.os }}-hf-weights-v1.0

      - name: Download Weights on Cache Miss
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          python -m pip install -U "huggingface_hub[cli]"
          python -m huggingface_hub.commands.huggingface_cli download alieissa/minilm-ui \
            --revision v1.0 \
            --local-dir ./vizQA/weights \
            --local-dir-use-symlinks False
            --token "$HF_TOKEN"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Run Tests & Coverage
        run: |
          # 1. Ensure we generate the JSON report directly from pytest
          # 2. Use --cov-report=json:coverage.json to specify the filename explicitly
          poetry run pytest --cov=vizQA --cov-report=json:coverage.json --cov-report=term
        # Keep continue-on-error if you want the badge to update even on test failure
        continue-on-error: true

      - name: Calculate Coverage and Colors
        id: coverage
        run: |
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

          # Determine color based on coverage
          if [ "$COVERAGE" -ge 90 ]; then
            COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 80 ]; then
            COLOR="green"
          elif [ "$COVERAGE" -ge 70 ]; then
            COLOR="yellowgreen"
          elif [ "$COVERAGE" -ge 60 ]; then
            COLOR="yellow"
          elif [ "$COVERAGE" -ge 40 ]; then
            COLOR="orange"
          else
            COLOR="red"
          fi
          echo "COLOR=$COLOR" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          # Update Coverage Badge
          sed -i "s|\[!\[Code Coverage\](https://img.shields.io/badge/coverage-.*-.*.svg)\]()|[![Code Coverage](https://img.shields.io/badge/coverage-${{ env.COVERAGE }}%25-${{ env.COLOR }}.svg)]()|" README.md

          # Update Build Status Badge (if tests passed)
          # We check if coverage.json exists to confirm tests ran
          if [ -f "coverage.json" ]; then
            sed -i "s|\[!\[Build Status\](https://img.shields.io/badge/build-.*-.*.svg)\]()|[![Build Status](https://img.shields.io/badge/build-passing-brightgreen.svg)]()|" README.md
          else
            sed -i "s|\[!\[Build Status\](https://img.shields.io/badge/build-.*-.*.svg)\]()|[![Build Status](https://img.shields.io/badge/build-failing-red.svg)]()|" README.md
          fi

      - name: Commit Badge Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README badges [skip ci]"
          file_pattern: README.md

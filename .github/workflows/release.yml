name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1)'
        required: true
        default: '0.1.1'

jobs:
  # ── 1. Validation ───────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry poetry-plugin-export

      - name: Export requirements
        run: poetry export --without-hashes --format=requirements.txt --output=requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  # ── 2. Build ────────────────────────────────────────────────────────────────
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Model Weights
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: ./vizQA/weights
          key: ${{ runner.os }}-hf-weights-v${{ github.event.inputs.version }}

      - name: Download Weights on Cache Miss
        if: steps.cache-weights.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          poetry run pip install -U "huggingface_hub[cli]" packaging
          REV=$(PYTHONPATH="$GITHUB_WORKSPACE" poetry run python -m vizQA.hf_revision "$PACKAGE_VERSION")
          echo "Using HF weights revision: $REV"
          poetry run hf download alieissa/minilm-ui \
            --revision "$REV" \
            --local-dir ./vizQA/weights \
            --token "$HF_TOKEN"

      - name: Set Version
        run: poetry version ${{ github.event.inputs.version }}

      - name: Build Package
        run: poetry build

      # Upload the dist/ folder so downstream jobs don't need to rebuild
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 3. Smoke Test ───────────────────────────────────────────────────────────
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install built package
        run: pip install dist/*.whl

      - name: Verify CLI version
        run: vizqa --version

      - name: Verify weights install
        run: vizqa install

  # ── 4. Publish to PyPI ────────────────────────────────────────────────────────
  publish-pypi:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 5. GitHub Release (tag v{version}, attach sdist/wheel) ───────────────────
  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # workflow_dispatch: github.sha is the HEAD of the branch you select when running the workflow.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          body: |
            Published to [PyPI](https://pypi.org/project/vizqa/${{ github.event.inputs.version }}/).
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: PR Test Comparison

on:
  pull_request:
    branches: [main, release/*, staging]

jobs:
  compare-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install

      # huggingface_hub may be transitive only; ensure CLI + resolver deps exist.
      - name: Install HF download helpers
        run: poetry run pip install -U "huggingface_hub[cli]" packaging

      - name: Resolve weights (PR head)
        id: weights-head
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          V=$(poetry run python -m vizQA.merged_tag_version HEAD)
          REV=$(PYTHONPATH="$GITHUB_WORKSPACE" poetry run python -m vizQA.hf_revision "$V")
          echo "package_version=$V" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "PR head: max merged tag version=$V -> HF revision=$REV"

      - name: Cache model weights (PR head)
        id: cache-weights-head
        uses: actions/cache@v4
        with:
          path: ./vizQA/weights
          key: ${{ runner.os }}-hf-pr-head-${{ steps.weights-head.outputs.revision }}

      - name: Download weights (PR head)
        if: steps.cache-weights-head.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          poetry run hf download alieissa/minilm-ui \
            --revision "${{ steps.weights-head.outputs.revision }}" \
            --local-dir ./vizQA/weights \
            --token "$HF_TOKEN"

      - name: Run Tests (PR Branch)
        run: |
          poetry run pytest --json-report --json-report-file=head_results.json --cov=vizQA --cov-report=term-missing
        continue-on-error: true

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base_repo
          fetch-depth: 0

      - name: Install Dependencies (base)
        working-directory: base_repo
        run: poetry install

      - name: Install HF download helpers (base venv)
        working-directory: base_repo
        run: poetry run pip install -U "huggingface_hub[cli]" packaging

      - name: Resolve weights (base branch)
        id: weights-base
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          V=$(poetry run python -m vizQA.merged_tag_version HEAD "${{ github.workspace }}/base_repo")
          REV=$(PYTHONPATH="${{ github.workspace }}" poetry run python -m vizQA.hf_revision "$V")
          echo "package_version=$V" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Base branch: max merged tag version=$V -> HF revision=$REV"

      - name: Cache model weights (base)
        id: cache-weights-base
        uses: actions/cache@v4
        with:
          path: base_repo/vizQA/weights
          key: ${{ runner.os }}-hf-pr-base-${{ steps.weights-base.outputs.revision }}

      - name: Download weights (base)
        if: steps.cache-weights-base.outputs.cache-hit != 'true'
        working-directory: base_repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          poetry run hf download alieissa/minilm-ui \
            --revision "${{ steps.weights-base.outputs.revision }}" \
            --local-dir "${{ github.workspace }}/base_repo/vizQA/weights" \
            --token "$HF_TOKEN"

      - name: Run Tests (Base Branch)
        run: |
          cd base_repo
          poetry run pytest --json-report --json-report-file=../base_results.json
        continue-on-error: true

      - name: Compare Results
        id: compare
        run: |
          poetry run python .github/scripts/pytest_report_compare.py base_results.json head_results.json > test_diff.md
          # capture exit code of pytest_report_compare
          EXIT_CODE=$?
          echo "diff_content<<EOF" >> $GITHUB_OUTPUT
          cat test_diff.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('test_diff.md')) {
              const diff = fs.readFileSync('test_diff.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: diff
              })
            }
